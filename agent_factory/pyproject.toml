[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "human-agent-governance"
version = "0.1.0"
description = "Owner-governed research runtime for Microsoft Agent Framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
framework = ["agent-framework-core==1.19.0"]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["human_agent_governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110
